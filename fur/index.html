<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fur editor</title>
<style>
  :root{--bg:#3d3846;--panel:#47414f;--line:#625a6c;--text:#eee;--dim:#b4adbd;--accent:#c9b9e8}
  html,body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
  /* the cat on the left as big as the room left beside the controls, the controls on the right (their width dragged by the bar between) */
  main{display:flex;height:100vh;box-sizing:border-box;padding:12px;gap:0}
  #view{flex:1;min-width:200px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow-y:auto}
  #wrap{position:relative;width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;flex:none;background:#8f938b}
  #split{flex:none;width:12px;cursor:col-resize;display:flex;justify-content:center}
  #split::after{content:"";width:4px;margin:0 4px;border-radius:2px;background:var(--line)}
  #split:hover::after,#split.drag::after{background:var(--accent)}
  #side{flex:none;width:var(--side,420px);min-width:280px;max-width:70vw;overflow-y:auto}
  /* Gav himself, as the project has him (the cat page in its fur page mode): only looked at, the overlay takes the pointer */
  #cat{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
  #overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #overlay.place{pointer-events:all;cursor:crosshair}
  .modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  button,select{font:inherit;padding:6px 10px;border:1px solid var(--line);background:var(--panel);border-radius:8px;color:var(--text)}
  button.on{background:var(--accent);color:#2a2530;border-color:var(--accent)}
  #info{color:var(--dim);font-size:12px;text-align:center}
  #panel{width:100%;display:flex;flex-direction:column;gap:6px}
  details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  summary{cursor:pointer;font-weight:600;padding:2px 0}
  .ctl{display:grid;grid-template-columns:1fr 190px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
  .ends{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--dim);margin-top:-2px} .ends i{font-style:normal}
  input[type=range]{width:100%;accent-color:var(--accent)}
  textarea{width:100%;box-sizing:border-box;min-height:70px;background:#2f2b36;color:var(--text);border:1px solid var(--line);border-radius:8px;font:12px ui-monospace,monospace;padding:6px}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
  .err{color:#ffb3b3;font-size:12px}
  .bend{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim)} .bend input{width:120px} .bend[hidden]{display:none}
</style>
</head>
<body>
<main>
 <div id="view">
  <div id="wrap">
    <iframe id="cat" src="../?wallpaper&amp;furpage" title="Gav"></iframe>
    <svg id="overlay"></svg>
  </div>
  <div class="modes">
    <button data-mode="move" class="on">Move</button>
    <button data-mode="source">+ Source point</button>
    <button data-mode="remove">Remove point</button>
    <button data-mode="glow" id="glowMode" hidden>Move gradient</button>
  </div>
  <div id="info">loading…</div>
 </div>
 <div id="split" title="Drag to resize"></div>
 <div id="side">
  <div id="panel">
    <div class="row"><select id="target"></select><select id="coat"></select>
      <label class="bend"><input type="checkbox" id="fullBody" style="width:auto">Full body fur</label>
      <label class="bend">Pose <select id="pose"></select></label>
      <label id="glowCtl" class="bend" hidden>Gradient size <input type="range" id="glowSize" min="0.2" max="1.5" step="0.01" value="0.6"></label><span id="saveErr" class="err"></span></div>
    <div id="groups"></div>
    <details>
      <summary>Copy &amp; load</summary>
      <div class="row"><button id="copy">Copy settings</button><button id="load">Load from box</button><span id="copyMsg" class="err" style="color:var(--dim)"></span></div>
      <textarea id="json" spellcheck="false"></textarea>
    </details>
  </div>
 </div>
</main>

<script>
// the controls' width: dragged by the bar beside them, remembered in this browser
(() => {
  const root = document.documentElement, split = document.getElementById('split');
  let w = 0; try { w = +localStorage.getItem('furSideW'); } catch (e) {}
  root.style.setProperty('--side', (w || Math.round(Math.min(Math.max(innerWidth - (innerHeight - 90) - 36, 280), innerWidth * 0.7))) + 'px');   // (first time: the cat fits the window's height)
  split.addEventListener('pointerdown', e => {
    e.preventDefault(); split.setPointerCapture(e.pointerId); split.classList.add('drag');
    const move = ev => { const w = Math.round(Math.min(Math.max(innerWidth - ev.clientX - 18, 280), innerWidth * 0.7)); root.style.setProperty('--side', w + 'px'); };
    const up = () => { split.classList.remove('drag'); split.removeEventListener('pointermove', move); split.removeEventListener('pointerup', up);
      try { localStorage.setItem('furSideW', parseInt(getComputedStyle(root).getPropertyValue('--side'))); } catch (e) {} };
    split.addEventListener('pointermove', move); split.addEventListener('pointerup', up);
  });
})();
</script>
<script type="module">
import { DEFAULTS } from './fur.js';
import { GAV } from './gav-parts.js';
import { glowOf } from './ear-glow.js';   // the inner ears' gradients
const $ = id => document.getElementById(id), NS = 'http://www.w3.org/2000/svg';

/* ---------- the whole cat: Gav in the frame is what the cat page shows (the same page, drawing, values and fur.js), held in a pose.
   The sliders set a value on every part of what is chosen at once: the cat (head, body, legs, tail), or the ears, or the inner ears,
   each with its own values (the inner ears' fur lies in the other way, see ear-glow.js) ---------- */
const PARTS = ['head', 'ears', 'innerEars', 'body', 'legs', 'fullBody', 'tail'];   // (every part with its points)
const TARGETS = { Cat: ['head', 'body', 'legs', 'fullBody', 'tail'], Ears: ['ears'], 'Inner ears': ['innerEars'] };
let target = 'Cat';
const COATS = { Siamese: 'siamese', Black: 'black' };
const all = await fetch('settings.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
let coat = 'Siamese', fullOn = !!all.options?.fullBody;
// a part's values as the cat takes them (one not tuned yet in this coat: the ones it falls back on, with its own flow points)
const valuesOf = (part, c = coat) => {
  const v = all[part + c]; if (v) return v;
  const from = (part === 'innerEars' && all['ears' + c]) || (part === 'fullBody' && all['legs' + c]) || all['head' + c] || all.headSiamese || DEFAULTS;
  return { ...from, points: (GAV[part] && GAV[part].points) || [] };
};
const mainPart = () => target === 'Cat' ? (fullOn ? 'fullBody' : 'body') : TARGETS[target][0];   // (the sliders show its values)

/* ---------- saving: each part into fur/settings.json (the edit server), and sent to every open cat page (the one here too) ---------- */
const chan = new BroadcastChannel('gav-fur');
function savePart(key, settings) {
  all[key] = settings;
  fetch('__save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ part: key, settings }) })
    .then(r => { if (!r.ok) throw r.status; $('saveErr').textContent = ''; }).catch(() => { $('saveErr').textContent = 'Not saved'; });
  chan.postMessage({ part: key, settings });
}

/* ---------- the sliders: no numbers, a scale round what looks right on Gav. The middle (0) is that value, set for the cat, the ears and the
   inner ears each; left is less, right more, up to what still looks like fur. Where the middle sits at an end of what the fur can take,
   or a slider has no right value (a direction, soft to crisp), it runs evenly from end to end. Double-click: back to the middle ---------- */
// [key, label, lo, hi, left word, right word, decimals, centred]
const GROUPS = {
  'Fur': [
    ['hairMin', 'Hair length inside', 2, 40, 'shorter', 'longer', 0, true], ['hairMax', 'Hair length near edge', 3, 60, 'shorter', 'longer', 0, true],
    ['edgeLength', 'Edge hair length', 0, 4, 'tighter outline', 'fluffier outline', 1, true], ['innerDensity', 'Inner density', 0, 1, 'thinner', 'thicker', 2, true],
    ['edgeDensity', 'Edge density', 0.5, 6, 'thinner', 'thicker', 1, true], ['edgeBand', 'Edge band width', 10, 160, 'narrow rim', 'wide rim', 0, true],
    ['crisp', 'Sharp inner hairs', 0, 1, 'soft', 'crisp', 2, false], ['variation', 'Strand variation', 0, 0.5, 'even colour', 'streaky', 2, true],
    ['rim', 'Edge brightness', 0, 0.6, 'none', 'glowing rim', 2, true],
  ],
  'Shape blur': [['blur', 'Shape blur', 0, 100, 'sharper', 'softer', 0, true], ['hairInset', 'Fur outset', 0, 15, 'slimmer', 'fatter', 1, true]],
  'Flow': [['gravity', 'Gravity', -1, 1, 'lifts up', 'hangs down', 2, false], ['edgeOut', 'Edge hair points outward', 0, 1.5, 'lies along the outline', 'sticks out', 2, false],
    ['waviness', 'Waviness', 0, 0.6, 'straight', 'wavy', 2, true]],
  'Color': [['colorBlur', 'Color blur', 0, 60, 'crisp markings', 'soft markings', 0, true], ['shading', 'Shading', 0, 1, 'flat', 'rounder', 2, true]],
};
// the middles: what looked right on 2026-11-20 (Fur outset as shown: how far outside the outline the fur starts)
const MID = {
  Cat: { hairMin: 20, hairMax: 16, edgeLength: 0.2, innerDensity: 1, edgeDensity: 2.9, edgeBand: 120, variation: 0.25, rim: 0.05, blur: 17, hairInset: 2, waviness: 0.43, colorBlur: 20, shading: 0.1 },
  Ears: { hairMin: 4, hairMax: 14, edgeLength: 0, innerDensity: 1, edgeDensity: 3.9, edgeBand: 101, variation: 0.22, rim: 0, blur: 5, hairInset: 0, waviness: 0.41, colorBlur: 12, shading: 0 },
  'Inner ears': { hairMin: 3, hairMax: 5, edgeLength: 0.5, innerDensity: 0.25, edgeDensity: 1.9, edgeBand: 25, variation: 0.14, rim: 0, blur: 1, hairInset: 0, waviness: 0.24, colorBlur: 0, shading: 0 },
};
// shown the other way round: Fur outset is how far outside Gav's outline the fur starts (fur.js's hairInset below 0)
const FLIP = new Set(['hairInset']);
const inputs = {};
// the scale (-1 … 1) ↔ a value: through the middle, or evenly from end to end
const midOf = ([key, , lo, hi, , , , centred]) => { const m = centred && MID[target][key]; return m === undefined || m === false || m - lo < 0.03 * (hi - lo) || hi - m < 0.03 * (hi - lo) ? (lo + hi) / 2 : m; };
const toValue = (d, s) => { const [, , lo, hi, , , dec] = d, m = midOf(d), v = s < 0 ? m + s * (m - lo) : m + s * (hi - m); return +v.toFixed(dec); };
const toScale = (d, v) => { const [, , lo, hi] = d, m = midOf(d); v = Math.min(hi, Math.max(lo, v)); return v < m ? (v - m) / (m - lo || 1) : (v - m) / (hi - m || 1); };
for (const [name, list] of Object.entries(GROUPS)) {
  const det = document.createElement('details'); det.open = name === 'Fur' || name === 'Shape blur';
  det.innerHTML = `<summary>${name}</summary>`;
  for (const d of list) {
    const [key, label, , , left, right] = d, row = document.createElement('div'); row.className = 'ctl';
    row.innerHTML = `<span>${label}</span><div><input type="range" min="-1" max="1" step="0.01" list="mid"><div class="ends"><i>${left}</i><i>${right}</i></div></div>`;
    const inp = row.querySelector('input');
    inp.oninput = () => { const v = toValue(d, +inp.value); queue({ [key]: FLIP.has(key) ? -v : v }); };
    inp.ondblclick = () => { inp.value = 0; inp.oninput(); };
    inputs[key] = { inp, d };
    det.appendChild(row);
  }
  $('groups').appendChild(det);
}
$('groups').insertAdjacentHTML('beforeend', '<datalist id="mid"><option value="0"></option></datalist>');   // (the middle's mark)
function syncControls() {
  const s = { ...DEFAULTS, ...valuesOf(mainPart()) };
  for (const [key, { inp, d }] of Object.entries(inputs)) inp.value = toScale(d, FLIP.has(key) ? Math.max(0, -s[key]) : s[key]);
}
// a value moved: every part of this coat takes it (a moment after the slider stops: each part's fur is made again)
let pending = {}, timer;
function queue(patch) {
  Object.assign(pending, patch); clearTimeout(timer);
  timer = setTimeout(() => { const p = pending; pending = {}; for (const part of TARGETS[target]) savePart(part + coat, { ...valuesOf(part), ...p }); }, 300);
}

/* ---------- the cat in the frame ---------- */
const frame = $('cat');
let W = null;   // the frame's window, once its cat and fur are up
const cd = () => W && W.catDebug;
async function catReady() {
  for (;;) {
    try { const w = frame.contentWindow; if (w && w.catDebug && w.catDebug.furMap()) { W = w; return; } } catch (e) {}
    await new Promise(r => setTimeout(r, 200));
  }
}
const POSE_NAMES = { stand: 'As drawn', sit: 'Sit', sitMid: 'Sitting down', lie: 'Lie', lieMid: 'Lying down', stretch: 'Stretch', reach: 'Reach',
  jumpReady: 'Ready to jump', jumpPush: 'Jump', jumpFly: 'In the air', jumpAbsorb: 'Landing' };
let pose = 'stand';
function setPose(name) { pose = name; $('pose').value = name; if (!cd()) return; cd().furEdit = null; cd().pose(name); }
$('pose').replaceChildren(...Object.entries(POSE_NAMES).map(([k, v]) => new Option(v, k)));
$('pose').onchange = () => setPose($('pose').value);

for (const k of Object.keys(COATS)) $('coat').append(new Option(k, k));
for (const k of Object.keys(TARGETS)) $('target').append(new Option(k, k));
// (the inner ears' gradients only with the ears)
const earTarget = () => target !== 'Cat';
$('target').onchange = () => { target = $('target').value; syncControls();
  $('glowMode').hidden = !earTarget(); if (mode === 'glow' && !earTarget()) document.querySelector('[data-mode=move]').click(); };
$('coat').onchange = () => { coat = $('coat').value; cd()?.setCoat(COATS[coat]); syncControls(); G = glowOf(all['innerEars' + coat]); $('glowSize').value = G.glowSize; };
$('fullBody').checked = fullOn;
$('fullBody').onchange = () => {
  fullOn = $('fullBody').checked; all.options = { fullBody: fullOn };
  fetch('__save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ part: 'options', settings: all.options }) })
    .then(r => { if (!r.ok) throw r.status; }).catch(() => { $('saveErr').textContent = 'Not saved'; });
  chan.postMessage({ part: 'options', settings: all.options });
  syncControls();
};

/* ---------- where things are: the cat's body units ↔ this page (the overlay's pixels) ---------- */
const wrapRect = () => $('wrap').getBoundingClientRect();
const fromClient = (M, x, y) => { const q = new DOMPoint(x, y).matrixTransform(M); return [q.x, q.y]; };   // (frame client px → this page, via M = the frame's CTM)
const toPage = (M, x, y) => { const q = new W.DOMPoint(x, y).matrixTransform(M); return [q.x, q.y]; };   // a point in M's units → the overlay's px (the frame fills the box)
const toUnits = (M, px, py) => { const q = new W.DOMPoint(px, py).matrixTransform(M.inverse()); return [q.x, q.y]; };
const mouse = e => { const r = wrapRect(); return [e.clientX - r.left, e.clientY - r.top]; };

/* each part's flow points (0–1 of its own fur's stage) on the cat as drawn: a drawing's spot is where its nearest line is now, moved as
   that line has moved (as drawn they only stand apart: the legs' drawing has them in rows) */
const segDist = (P, x, y) => { let d = Infinity; for (let i = 0; i + 1 < P.length; i++) { const [a, b] = [P[i], P[i + 1]], dx = b[0] - a[0], dy = b[1] - a[1], t = Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy || 1))); d = Math.min(d, Math.hypot(x - a[0] - dx * t, y - a[1] - dy * t)); } return d; };
const nearest = (L, x, y) => { let j = 0, b = Infinity; L.forEach((P, i) => { const d = segDist(P, x, y); if (d < b) { b = d; j = i; } }); return [j, b]; };
function maps() {
  const M = cd()?.furMap(); if (!M) return null;
  const byPart = {};
  for (const g of M.parts) if (!byPart[g.part]) byPart[g.part] = g;   // (the legs' two groups: one drawing)
  const out = [];
  for (const g of Object.values(byPart)) {
    const { fit } = g, shift = g.rest.map((P, j) => [g.now[j][0][0] - P[0][0], g.now[j][0][1] - P[0][1]]);
    out.push({ part: g.part, lines: g.now,
      toBody: (sx, sy) => { const x = (sx * 780 - fit.tx) / fit.s, y = (sy * 780 - fit.ty) / fit.s, [j] = nearest(g.rest, x, y); return [x + shift[j][0], y + shift[j][1]]; },
      toStage: (bx, by) => { const [j] = nearest(g.now, bx, by), x = bx - shift[j][0], y = by - shift[j][1]; return [(x * fit.s + fit.tx) / 780, (y * fit.s + fit.ty) / 780]; } });
  }
  if (M.head) { const { fit, ctm } = M.head;
    out.push({ part: 'head', head: true,
      toPagePt: (sx, sy) => toPage(ctm, (sx * 780 - fit.tx) / fit.s, (sy * 780 - fit.ty) / fit.s),
      toStageFromPage: (px, py) => { const [x, y] = toUnits(ctm, px, py); return [(x * fit.s + fit.tx) / 780, (y * fit.s + fit.ty) / 780]; } }); }
  return { body: M.body, list: out, inner: M.inner };
}
// every point shown: [part, index, x, y (overlay px)]
function shownPoints(m) {
  const P = [];
  for (const it of m.list) {
    const pts = valuesOf(it.part).points || [];
    pts.forEach((q, i) => { const [x, y] = it.head ? it.toPagePt(q.x, q.y) : toPage(m.body, ...it.toBody(q.x, q.y)); P.push([it.part, i, x, y]); });
  }
  return P;
}
// the part a spot of the cat belongs to: the head or an ear if it is on its drawing, else the body's part whose line is nearest
function partAt(m, px, py) {
  const doc = frame.contentDocument, on = id => { const el = doc.getElementById(id); if (!el || !el.isPointInFill) return false; const [x, y] = toUnits(el.getScreenCTM(), px, py); return el.isPointInFill(new W.DOMPoint(x, y)); };
  if (on('skull')) return m.list.find(it => it.head) || null;
  if (on('earL') || on('earR')) return m.list.find(it => it.part === 'ears') || null;
  const [bx, by] = toUnits(m.body, px, py); let best = null, bd = Infinity;
  for (const it of m.list) if (!it.head && it.part !== 'ears' && it.part !== 'innerEars') { const [, d] = nearest(it.lines, bx, by); if (d < bd) { bd = d; best = it; } }
  return best;
}

/* ---------- modes: Move (drag a spine's dot, only to look; or a flow point), + Source point, Remove point, Move gradient ---------- */
let mode = 'move';
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  if (mode !== 'move' && pose !== 'stand') setPose('stand');   // (points and the gradients go on the cat as drawn)
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b));
  $('overlay').classList.toggle('place', mode !== 'move');
  $('glowCtl').hidden = mode !== 'glow';
});

// the inner ears' gradients (G): each one's middle at 0–1 of its ear's box
let G = glowOf(all['innerEars' + coat]); $('glowSize').value = G.glowSize;
const saveGlow = () => savePart('innerEars' + coat, { ...valuesOf('innerEars'), ...G });
let glowT = null; const glowSoon = () => { clearTimeout(glowT); glowT = setTimeout(saveGlow, 150); };
$('glowSize').oninput = () => { G = { ...G, glowSize: +$('glowSize').value }; glowSoon(); };
function glowAt(m, px, py, pick) {
  const E = m.inner.map(e => e && { ...e, mid: toPage(e.ctm, e.b.x + e.b.width / 2, e.b.y + e.b.height / 2) });
  // (a click picks the inner ear it is on or near, within half the ear's size round it; anywhere else it does nothing)
  let i = pick; if (i == null) { let bd = Infinity; E.forEach((e, k) => { if (!e) return; const [x, y] = toUnits(e.ctm, px, py), u = (x - e.b.x) / e.b.width, v = (y - e.b.y) / e.b.height;
    if (u < -0.5 || u > 1.5 || v < -0.5 || v > 1.5) return; const d = Math.hypot(e.mid[0] - px, e.mid[1] - py); if (d < bd) { bd = d; i = k; } }); }
  if (i == null) return null;
  const { b, ctm } = E[i], [x, y] = toUnits(ctm, px, py), r = v => +Math.min(1.5, Math.max(-0.5, v)).toFixed(3);
  G = { ...G, glow: G.glow.map((g, k) => k === i ? { x: r((x - b.x) / b.width), y: r((y - b.y) / b.height) } : g) };
  glowSoon(); return i;
}

// dragging: a spine's dot (FUR_EDIT in the cat: shown, never saved), a flow point (saved when let go), an ear's gradient
let drag = null;
const LINE = { body: 'body', legs: 'legs', tail: 'tail' };
function carried(P, H, Hb) {   // P moved as far as the spot of the body nearest its root moved (H before → Hb after); it doesn't turn
  let best = null;
  for (let k = 0; k < H.length - 1; k++) {
    const A = H[k], B = H[k + 1], dx = B[0] - A[0], dy = B[1] - A[1], t = Math.max(0, Math.min(1, ((P[0][0] - A[0]) * dx + (P[0][1] - A[1]) * dy) / (dx * dx + dy * dy || 1)));
    const d = Math.hypot(P[0][0] - A[0] - dx * t, P[0][1] - A[1] - dy * t); if (!best || d < best.d) best = { k, t, d };
  }
  const { k, t } = best, mx = (Hb[k][0] - H[k][0]) * (1 - t) + (Hb[k + 1][0] - H[k + 1][0]) * t, my = (Hb[k][1] - H[k][1]) * (1 - t) + (Hb[k + 1][1] - H[k + 1][1]) * t;
  return P.map(q => [q[0] + mx, q[1] + my]);
}
$('overlay').addEventListener('pointerdown', e => {
  const m = maps(); if (!m) return;
  const [px, py] = mouse(e), t = e.target.closest('[data-pt],[data-sp]');
  e.preventDefault();
  if (t && t.dataset.sp && mode === 'move') {   // a spine's dot
    const [line, j, i] = t.dataset.sp.split(',');
    if (!cd().furEdit) cd().furEdit = JSON.parse(JSON.stringify(cd().furSpines()));
    drag = { kind: 'spine', line, j: +j, i: +i }; return;
  }
  if (t && t.dataset.pt) {   // a flow point
    const [part, i] = t.dataset.pt.split(','), it = m.list.find(x => x.part === part), pts = JSON.parse(JSON.stringify(valuesOf(part).points || []));
    if (mode === 'remove') { pts.splice(+i, 1); savePart(part + coat, { ...valuesOf(part), points: pts }); return; }
    if (mode !== 'glow') { drag = { kind: 'point', it, i: +i, pts, at: [px, py] }; return; }
  }
  if (mode === 'source') {
    const it = partAt(m, px, py); if (!it) return;
    const [sx, sy] = it.head ? it.toStageFromPage(px, py) : it.toStage(...toUnits(m.body, px, py));
    const pts = [...(valuesOf(it.part).points || []), { x: +sx.toFixed(4), y: +sy.toFixed(4), type: 'source', strength: 1 }];
    savePart(it.part + coat, { ...valuesOf(it.part), points: pts });
  } else if (mode === 'remove') {   // the nearest point within reach
    let best = null, bd = 24; for (const [part, i, x, y] of shownPoints(m)) { const d = Math.hypot(x - px, y - py); if (d < bd) { bd = d; best = [part, i]; } }
    if (best) { const pts = [...valuesOf(best[0]).points]; pts.splice(best[1], 1); savePart(best[0] + coat, { ...valuesOf(best[0]), points: pts }); }
  } else if (mode === 'glow') { const i = glowAt(m, px, py, null); if (i != null) drag = { kind: 'glow', i }; }
});
addEventListener('pointermove', e => {
  if (!drag) return;
  const m = maps(); if (!m) return;
  const [px, py] = mouse(e);
  if (drag.kind === 'spine') {
    const E = cd().furEdit, q = toUnits(m.body, px, py), L = E[drag.line][drag.j], before = E.body[0].map(p => [...p]);
    L[drag.i] = [q[0], q[1]];
    if (drag.line === 'body') { E.legs = E.legs.map(P => carried(P, before, E.body[0])); E.tail = E.tail.map(P => carried(P, before, E.body[0])); }   // (the legs and tail go with the body)
    cd().furEdit = E;
  } else if (drag.kind === 'point') drag.at = [px, py];
  else if (drag.kind === 'glow') glowAt(m, px, py, drag.i);
});
addEventListener('pointerup', () => {
  const d = drag; drag = null; if (!d || d.kind !== 'point') return;
  const m = maps(); if (!m) return;
  const it = d.it, [px, py] = d.at, [sx, sy] = it.head ? it.toStageFromPage(px, py) : it.toStage(...toUnits(m.body, px, py));
  d.pts[d.i] = { ...d.pts[d.i], x: +sx.toFixed(4), y: +sy.toFixed(4) };
  savePart(it.part + coat, { ...valuesOf(it.part), points: d.pts });
});

/* ---------- the overlay, drawn every frame from where the cat is ---------- */
function drawOverlay() {
  requestAnimationFrame(drawOverlay);
  const m = W && maps(); if (!m) return;
  const r = wrapRect(), sp = cd().furSpines(); let h = '';
  $('overlay').setAttribute('viewBox', `0 0 ${r.width} ${r.height}`);
  if (sp && mode === 'move') for (const line of ['tail', 'legs', 'body']) (sp[line] || []).forEach((P, j) => {   // the spines' dots
    const Q = P.map(q => toPage(m.body, q[0], q[1]));
    h += `<polyline points="${Q.map(q => q.join(',')).join(' ')}" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="1.5"/>`;
    h += Q.map((q, i) => `<circle data-sp="${line},${j},${i}" cx="${q[0]}" cy="${q[1]}" r="6" fill="#c9b9e8" fill-opacity="0.85" stroke="#3d3846" stroke-width="1.5" style="pointer-events:all;cursor:move"/>`).join('');
  });
  if (pose === 'stand' && !cd().furEdit) for (const [part, i, x0, y0] of shownPoints(m)) {   // the flow points (as drawn)
    const [x, y] = drag && drag.kind === 'point' && drag.it.part === part && drag.i === i ? drag.at : [x0, y0];
    h += `<circle data-pt="${part},${i}" cx="${x}" cy="${y}" r="9" fill="none" stroke="#fff" stroke-width="2" style="pointer-events:all;cursor:${mode === 'remove' ? 'pointer' : 'move'}"/><circle cx="${x}" cy="${y}" r="2.5" fill="#fff"/>`;
  }
  if (mode === 'glow') m.inner.forEach((e, i) => { if (!e) return; const g = G.glow[i], [x, y] = toPage(e.ctm, e.b.x + g.x * e.b.width, e.b.y + g.y * e.b.height);   // the gradients' middles
    h += `<path d="M${x - 8} ${y}h16M${x} ${y - 8}v16" stroke="#fff" stroke-width="2"/>`; });
  if (h !== drawOverlay.last) { $('overlay').innerHTML = h; drawOverlay.last = h; }
}

/* ---------- copy & load: this coat's values for every part ---------- */
$('copy').onclick = async () => {
  $('json').value = JSON.stringify(Object.fromEntries(PARTS.map(p => [p + coat, valuesOf(p)])), null, 1);
  try { await navigator.clipboard.writeText($('json').value); $('copyMsg').textContent = 'Copied'; }
  catch { $('json').select(); $('copyMsg').textContent = 'Select & copy from the box'; }
};
$('load').onclick = () => {
  try { const j = JSON.parse($('json').value); for (const [k, v] of Object.entries(j)) if (/^(head|ears|innerEars|body|legs|fullBody|tail)(Siamese|Black)$/.test(k)) savePart(k, v); syncControls(); $('copyMsg').textContent = 'Loaded'; }
  catch (e) { $('copyMsg').textContent = 'Invalid JSON'; }
};

/* ---------- start ---------- */
syncControls();
$('info').textContent = 'loading…';
await catReady();
coat = cd().settings.coat === 'siamese' ? 'Siamese' : 'Black'; $('coat').value = coat; syncControls();
G = glowOf(all['innerEars' + coat]); $('glowSize').value = G.glowSize;
setPose('stand');
$('info').textContent = '';
drawOverlay();
</script>
